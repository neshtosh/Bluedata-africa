name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Includes: Testcontainers integration tests (PostGIS, Valkey) — Docker is available on
      # GitHub-hosted Ubuntu runners — the OpenAPI drift check, and the real-Node module-graph test.
      - run: pnpm turbo run build typecheck lint test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm --filter @blue/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @blue/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            tests/e2e/.artifacts
          retention-days: 7

  images:
    name: Docker image (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: infra/docker/api.Dockerfile, args: '' }
          - {
              name: samakios-web,
              dockerfile: infra/docker/web.Dockerfile,
              args: 'APP=samakios-web',
            }
          - {
              name: bluedata-web,
              dockerfile: infra/docker/web.Dockerfile,
              args: 'APP=bluedata-web',
            }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.args }}
          tags: blue-${{ matrix.image.name }}:ci
          load: true
          push: false # no registry until the cloud provider is chosen (ADR-010)
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Smoke test (API image loads its entry modules)
        if: matrix.image.name == 'api'
        run: >
          docker run --rm blue-api:ci node --input-type=module -e
          "await import('/app/dist/create-app.js'); await import('/app/dist/create-worker.js'); console.log('ok')"
      - name: Smoke test (web image serves the sign-in page)
        if: matrix.image.name != 'api'
        run: |
          docker run -d --name web -p 3000:3000 blue-${{ matrix.image.name }}:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/sign-in > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3000/sign-in | grep -q '<title>'
          docker rm -f web
