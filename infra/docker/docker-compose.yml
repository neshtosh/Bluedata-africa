# Local development services. NOT for production — production uses managed services (ADR-010).
# Usage (from repo root): pnpm services:up | pnpm services:down | pnpm services:reset
name: blue-ecosystem

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blue}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # Consumed by initdb/01-roles.sh to create the least-privilege roles (DATABASE.md §5, ADR-004).
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-migrator_dev}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-runtime_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.1
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches all outgoing email locally (OTP, invitations). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Object storage (documents, CSV imports) is added with the documents module in Phase 3.
  # MinIO stopped publishing community Docker images in late 2025, so the local S3 emulator
  # choice is deferred until then.

volumes:
  postgres-data:
  valkey-data:
